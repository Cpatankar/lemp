name: LEMP Server
on:
  push:
    branches:
    - main
jobs:
  Docker-LEMP:
    runs-on: self-hosted
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v3
      - name: Install Docker & Docker Compose on my lemp-runner for chandru
        run: |
            sudo apt-get update
            sudo apt-get install docker.io -y
            mkdir -p ~/.docker/cli-plugins/
            curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o ~/.docker/cli-plugins/docker-compose
            chmod +x ~/.docker/cli-plugins/docker-compose
            docker compose version
            sudo usermod -aG docker github
        
      - name: Logging into the Docker Hub
        uses: docker/login-action@v1
        with:
           username: ${{ secrets.chandrakat1 }}
           password: ${{ secrets.dckr_pat_djKvwZ_N5RO8LI__jxIQQTX8d9k }}

      - name: Build Docker Images with their respective tags
        run: docker compose build
          
      - name: Push Docker images to Docker Hub
        run: docker compose push   
